# フェーズ4: 実データ1板（zoid）での小規模E2E用構成。
# charset_table は docs/charset-verification.md で確定した値（変更禁止）。

source src_zoid {
    type            = tsvpipe
    tsvpipe_command = cat /work/zoid.tsv
    tsvpipe_field   = title
    tsvpipe_field   = board
}

table kako_new_e2e {
    type              = plain
    source            = src_zoid
    path              = /work/data/kako_new_e2e

    ngram_len         = 0
    min_word_len      = 1
    html_strip        = 0
    index_exact_words = 0

    charset_table     = non_cjk, cjk, \
        U+0021..U+002F, U+003A..U+0040, U+005B..U+0060, U+007B..U+007E, \
        U+00A1..U+00BF, U+00D7, U+00F7, \
        U+200D, U+2010..U+2BFF, \
        U+3001..U+303F, U+3041..U+309F, U+30A0..U+30FF, U+31F0..U+31FF, \
        U+1F000..U+1FAFF

    stored_fields     =

    preopen           = 1
    access_doclists   = file
    access_hitlists   = file
}

searchd {
    # テスト専用: コンテナ外から叩くため全IFで待ち受ける。本番は 127.0.0.1 のみ。
    listen           = 9306:mysql
    listen           = 9308:http
    log              = /work/searchd.log
    query_log        = /work/query.log
    pid_file         = /work/searchd.pid
    binlog_path      =
}
