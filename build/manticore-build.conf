# kako_new / kako_old フル構築用（構築マシン、仕様書7章）。
# 実行はコンテナ内: -v <repo>:/repo -v <repo>/build/full:/work
# charset_table は docs/charset-verification.md で確定した値（変更禁止）。
# indexer の mem_limit は構築マシン専用の値であり、本番 searchd とは無関係（仕様書7.3）。

source src_kako_new {
    type            = tsvpipe
    tsvpipe_command = /repo/bin/kakoctl-linux export --order new --db /repo/db/kakolog.db
    tsvpipe_field   = title
    tsvpipe_field   = board
}

source src_kako_old {
    type            = tsvpipe
    tsvpipe_command = /repo/bin/kakoctl-linux export --order old --db /repo/db/kakolog.db
    tsvpipe_field   = title
    tsvpipe_field   = board
}

table kako_new {
    type              = plain
    source            = src_kako_new
    path              = /work/data/kako_new

    # --- 日本語処理は全て無効化。トークン化は自前（仕様書4.2）---
    ngram_len         = 0
    min_word_len      = 1
    html_strip        = 0
    index_exact_words = 0

    charset_table     = non_cjk, cjk, \
        U+0021..U+002F, U+003A..U+0040, U+005B..U+0060, U+007B..U+007E, \
        U+00A1..U+00BF, U+00D7, U+00F7, \
        U+200D, U+2010..U+2BFF, \
        U+3001..U+303F, U+3041..U+309F, U+30A0..U+30FF, U+31F0..U+31FF, \
        U+1F000..U+1FAFF

    # --- 属性なし・本文保存なし（仕様書6.3。この3点は絶対に外さない）---
    stored_fields     =

    preopen           = 1
    access_doclists   = file
    access_hitlists   = file
}

table kako_old {
    type              = plain
    source            = src_kako_old
    path              = /work/data/kako_old

    ngram_len         = 0
    min_word_len      = 1
    html_strip        = 0
    index_exact_words = 0

    charset_table     = non_cjk, cjk, \
        U+0021..U+002F, U+003A..U+0040, U+005B..U+0060, U+007B..U+007E, \
        U+00A1..U+00BF, U+00D7, U+00F7, \
        U+200D, U+2010..U+2BFF, \
        U+3001..U+303F, U+3041..U+309F, U+30A0..U+30FF, U+31F0..U+31FF, \
        U+1F000..U+1FAFF

    stored_fields     =

    preopen           = 1
    access_doclists   = file
    access_hitlists   = file
}

indexer {
    mem_limit       = 4096M
    write_buffer    = 16M
}

searchd {
    # 構築後の検証（7.4）用。テスト専用に全IFで待ち受ける。本番は 127.0.0.1 のみ。
    listen           = 9306:mysql
    listen           = 9308:http
    log              = /work/searchd.log
    query_log        = /work/query.log
    pid_file         = /work/searchd.pid
    binlog_path      =
}
