# charset_table 検証用の小規模構成（仕様書6.4）。本番設定の原型でもある。
# Manticore 28.6.6 で検証。

source src_test {
    type            = tsvpipe
    tsvpipe_command = cat /work/test.tsv
    tsvpipe_field   = title
    tsvpipe_field   = board
}

table kako_test {
    type              = plain
    source            = src_test
    path              = /work/data/kako_test

    # --- 日本語処理は全て無効化。トークン化は自前で済ませてある（仕様書4.2）---
    ngram_len         = 0
    min_word_len      = 1
    html_strip        = 0
    index_exact_words = 0

    # 実測（docs/charset-verification.md）に基づく確定値。
    # - cjk エイリアスは かな の小書き統合（つ->っ, ケ->ヶ 等）を行うため、
    #   かなブロックを恒等マッピングで上書きする（charset_table は後勝ち）
    # - ASCII 記号・CJK記号・絵文字・ZWJ(U+200D) を有効文字として明示追加
    #   （_ が区切り扱いだと board トークン b_xxx が分裂する）
    charset_table     = non_cjk, cjk, \
        U+0021..U+002F, U+003A..U+0040, U+005B..U+0060, U+007B..U+007E, \
        U+00A1..U+00BF, U+00D7, U+00F7, \
        U+200D, U+2010..U+2BFF, \
        U+3001..U+303F, U+3041..U+309F, U+30A0..U+30FF, U+31F0..U+31FF, \
        U+1F000..U+1FAFF

    # 属性なし・本文保存なし（仕様書6.3）
    stored_fields     =

    preopen           = 1
    access_doclists   = file
    access_hitlists   = file
}

searchd {
    # テスト専用: コンテナ外から叩くため全IFで待ち受ける。
    # 本番は必ず 127.0.0.1 のみ（仕様書6.5）。
    listen           = 9306:mysql
    listen           = 9308:http
    log              = /work/searchd.log
    query_log        = /work/query.log
    pid_file         = /work/searchd.pid
    binlog_path      =
}
