# KakologInfo（仕様書13.3, 13.4）
# 配置先: /etc/nginx/sites-available/kakosearch → sites-enabled にリンク
# TLS は certbot --nginx で後付けする（このファイルに自動追記される）

# レート制限: IP あたり 2req/s・バースト10（仕様書13.4 MUST）
limit_req_zone $binary_remote_addr zone=kakoapi:10m rate=2r/s;

# 検索結果ページを noindex にする（仕様書13.4・17.3 MUST）。
# SPA なので URL は /?q=... の形になる。クローラに深いページネーションを踏まれると
# サービスが停止しうるため、q が付いていれば必ず noindex を返す。
# 値が空のとき nginx は add_header 自体を出力しないので、トップと板一覧は
# インデックス可のまま残る（仕様書17.3）。
map $arg_q $robots_tag {
    default "noindex, follow";
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    # ドメインを取得したら書き換える（例: kakolog.info www.kakolog.info）
    server_name kakolog.info www.kakolog.info;

    root /opt/kakosearch/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        limit_req zone=kakoapi burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        # 同一クエリの連打吸収（仕様書13.3）。API 自身も Cache-Control を返す
    }

    location / {
        # $is_args$args を明示的に引き継ぐこと。付けないと "/?q=..." の内部リダイレクト時に
        # クエリ文字列が失われ、$arg_q が空になって上の map が noindex を返さなくなる
        try_files $uri /index.html$is_args$args;
        # 静的ファイルはブラウザキャッシュ短め（デプロイ即反映を優先）
        add_header Cache-Control "public, max-age=300";
        add_header X-Robots-Tag $robots_tag;
    }

    # メンテナンス時: systemctl stop kakosearch-api で /api/ は 502 になる。
    # 502/503/504 を 503 固定ページに寄せる（仕様書8.3）
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html { internal; }
}
