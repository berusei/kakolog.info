# 本番 VPS 用 Manticore 設定（searchd と、夜間再構築用の indexer 定義を兼ねる）
# 配置先: /etc/manticoresearch/manticore.conf
# Manticore 28.6.6 で検証。charset_table は docs/charset-verification.md の確定値（変更禁止）

# --- 再構築用ソース（indexer のみが使用。searchd は無視する） ---

source src_kako_new {
    type            = tsvpipe
    tsvpipe_command = /opt/kakosearch/bin/kakoctl export --order new --db /opt/kakosearch/db/kakolog.db
    tsvpipe_field   = title
    tsvpipe_field   = board
}

source src_kako_old {
    type            = tsvpipe
    tsvpipe_command = /opt/kakosearch/bin/kakoctl export --order old --db /opt/kakosearch/db/kakolog.db
    tsvpipe_field   = title
    tsvpipe_field   = board
}

# --- テーブル定義（トークン化設定は構築・検索の両方で使われる） ---

table kako_new {
    type              = plain
    source            = src_kako_new
    path              = /var/lib/manticore/data/kako_new

    # 日本語処理は全て無効化。トークン化は kakoctl（internal/tokenizer）が済ませてある
    ngram_len         = 0
    min_word_len      = 1
    html_strip        = 0
    index_exact_words = 0

    charset_table     = non_cjk, cjk, \
        U+0021..U+002F, U+003A..U+0040, U+005B..U+0060, U+007B..U+007E, \
        U+00A1..U+00BF, U+00D7, U+00F7, \
        U+200D, U+2010..U+2BFF, \
        U+3001..U+303F, U+3041..U+309F, U+30A0..U+30FF, U+31F0..U+31FF, \
        U+1F000..U+1FAFF

    stored_fields     =

    preopen           = 1
    access_doclists   = file
    access_hitlists   = file
}

table kako_old {
    type              = plain
    source            = src_kako_old
    path              = /var/lib/manticore/data/kako_old

    ngram_len         = 0
    min_word_len      = 1
    html_strip        = 0
    index_exact_words = 0

    charset_table     = non_cjk, cjk, \
        U+0021..U+002F, U+003A..U+0040, U+005B..U+0060, U+007B..U+007E, \
        U+00A1..U+00BF, U+00D7, U+00F7, \
        U+200D, U+2010..U+2BFF, \
        U+3001..U+303F, U+3041..U+309F, U+30A0..U+30FF, U+31F0..U+31FF, \
        U+1F000..U+1FAFF

    stored_fields     =

    preopen           = 1
    access_doclists   = file
    access_hitlists   = file
}

indexer {
    # 再構築（deploy/rebuild.sh）用。RAM 3.8GB のうち 2GB まで
    mem_limit    = 2048M
    write_buffer = 16M
}

searchd {
    # 外部に晒さない。必ず 127.0.0.1 のみ（仕様書6.5 MUST）
    listen              = 127.0.0.1:9312
    listen              = 127.0.0.1:9306:mysql   # Go API はこちらに接続
    listen              = 127.0.0.1:9308:http    # ベンチ・ヘルスチェック用（ループバック限定）

    log                 = /var/log/manticore/searchd.log
    query_log           = /var/log/manticore/query.log
    query_log_format    = sphinxql
    query_log_min_msec  = 500                    # スローログ（仕様書12.4）
    pid_file            = /var/run/manticore/searchd.pid

    threads             = 4                      # vCPU 数に合わせる
    qcache_max_bytes    = 0
    read_timeout        = 5
    network_timeout     = 5
    max_packet_size     = 8M
    seamless_rotate     = 1                      # 再構築の無停止差し替え
}
